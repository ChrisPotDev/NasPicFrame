; NasPicFrame music add-on configuration (installed to /etc/picframe/music.ini).
; Changes are picked up within ~5 seconds; the receivers restart with the new settings.

[music]
; Name guests see in YouTube Music's cast menu, Spotify's device list and AirPlay.
name = Living Room

; Optional per-app names. Empty = use `name`.
youtube_name =
spotify_name =
airplay_name =

; Which receivers run (yes/no).
youtube = yes
spotify = yes
airplay = yes

; AirPlay password. Empty = anyone on the network can play.
airplay_password =

[output]
; Where the sound goes:
;   auto       = USB DAC if one is plugged in, otherwise the headphone jack.
;                Follows unplugging and re-plugging the DAC.
;   usb        = USB DAC only (silent if it's missing)
;   headphones = 3.5 mm headphone jack only
;   hdmi       = the screen's speakers
output = auto

; Pin a specific USB device by (part of) its name, if more than one is connected.
; See the names with: pactl list short sinks
usb_device =

[volume]
; Percent. Guests' phone volume controls the range from 0 up to this cap.
; Set your amplifier so 100% would be the loudest you'd ever want.
max_volume = 80

; Volume each new session starts at, so the first song is never a blast.
start_volume = 40

; Lower cap during quiet hours: HH:MM-HH:MM, may cross midnight. Empty = no quiet hours.
quiet_hours = 22:00-07:00
quiet_max_volume = 50

[behaviour]
; New guests may take over what's playing (unless locked from Home Assistant).
allow_takeover = yes

; Clear the YouTube queue after this many minutes without playback (0 = never).
idle_clear_minutes = 30

[updates]
; Update yt-dlp (which fetches YouTube audio) nightly from its official releases.
; The previous version is restored automatically if the new one fails a test.
auto_update_ytdlp = yes

[mqtt]
; Home Assistant entities: now playing, source, volume, stop, lock.
; The installer pre-fills these from the frame's config if the frame is installed.
enabled = no
host = homeassistant.local
port = 1883
username =
password =
topic_prefix = picframe
discovery_prefix = homeassistant
; Unique id for this speaker. Empty = the Pi's hostname.
node_id =
