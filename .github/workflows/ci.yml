name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Run against the same Debian packages Raspberry Pi OS installs (apt, not pip),
    # so version differences (pygame 2.1 / Pillow 9.4 / paho 1.6 on Bookworm) are caught.
    # Covers the frame (tests/) and the music add-on's Python (addons/music/tests/).
    name: Tests (Debian ${{ matrix.debian }})
    runs-on: ubuntu-latest
    container: debian:${{ matrix.debian }}
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]
    steps:
      - name: Install Raspberry Pi OS packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pygame python3-pil python3-paho-mqtt python3-pytest fonts-dejavu-core
      - uses: actions/checkout@v5
      - name: Package versions
        run: python3 -c "import sys, pygame, PIL; print(sys.version); print('Pillow', PIL.__version__)"
      - name: Run tests
        run: python3 -m pytest -v

  youtube-receiver:
    # Node 20 = the version Raspberry Pi OS Trixie ships.
    name: YouTube receiver (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addons/music/youtube-receiver
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: addons/music/youtube-receiver/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Syntax check
        run: for f in *.js; do node --check "$f"; done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ruff (Python)
        run: pipx run ruff==0.16.9 check --output-format=github .
      - name: ShellCheck
        run: shellcheck install.sh addons/music/*.sh
