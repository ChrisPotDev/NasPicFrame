; NasPicFrame configuration (installed to /etc/picframe/config.ini).
; The slideshow notices changes to this file within ~5 seconds and restarts itself.

[slideshow]
; Folder(s) holding the photos. Sub-folders are included.
; Mix the network share with local folders (SD card, USB stick) by listing several,
; separated by commas or one per indented line:
;   image_dir = /mnt/photos
;       /home/pi/Pictures
;       /media/pi/USBSTICK/Photos
; All folders feed one shuffle. If the NAS is down, the local photos keep showing.
image_dir = /mnt/photos

; Seconds each photo stays on screen.
delay = 30

; Include sub-folders (yes/no).
recursive = yes

; File types to show (comma separated).
extensions = .jpg, .jpeg, .png, .webp, .bmp, .gif

; contain = whole photo visible (spare space filled by the mat, see below)
; cover   = fill the screen, cropping the edges
fit = contain

; Show two portrait photos side by side instead of one with wide borders.
; (On a portrait-mounted screen, two landscape photos are stacked instead.)
pair_portraits = yes
; Pixels between the two photos of a pair.
pair_gap = 8

; What fills the space around a photo that doesn't match the screen's shape:
;   blur  = a heavily blurred, darkened copy of the photo itself
;   color = plain `background` colour
matting = blur
; Blur strength (radius in screen pixels) and brightness of the mat (0.0 - 1.0).
mat_blur = 40
mat_brightness = 0.45

; Colour of the gap between paired photos, and of the mat when matting = color.
; A CSS colour name (black, dimgray) or hex (#202020).
background = black

; Crossfade length in milliseconds (0 = hard cut, lowest CPU use).
transition_ms = 800

; How often to re-read the share for new/deleted photos.
rescan_minutes = 60

; Image shown while there are no photos to show (share empty or unreachable).
; Empty = the built-in placeholder. Use a file on the Pi itself, not on the share.
placeholder_image =

[overlay]
; Start-up state of the on-screen clock and photo info (both can be toggled over MQTT).
show_clock = yes
show_info = yes

; strftime formats. %H:%M = 21:05, %-I:%M %p = 9:05 PM, %-d %B %Y = 5 August 2019
clock_format = %H:%M
date_format = %-d %B %Y

; Font: a family name (e.g. DejaVu Sans) or a path to a .ttf file. Empty = DejaVu Sans.
font =

; Where the photo was taken comes from its EXIF GPS data.
;   no        = show coordinates, e.g. 48.8584°N 2.2945°E  (nothing leaves the Pi)
;   nominatim = look up "Town, Country" from OpenStreetMap's Nominatim service.
;               This sends photo coordinates (rounded to ~100 m) to openstreetmap.org.
;               Results are cached in ~/.cache/picframe/geocode.json.
geocode = no
; Language for place names (en, de, fr, ...).
geocode_language = en

[schedule]
; 24-hour HH:MM, local time (set the timezone with raspi-config!).
; The display is on from wake_time until sleep_time and off otherwise.
; Periods that cross midnight work too (e.g. wake_time = 18:00, sleep_time = 01:00).
; Leave both empty to keep the display on permanently.
; Turning the display on/off over MQTT overrides this until the next scheduled switch.
wake_time = 07:00
sleep_time = 22:00

[display]
; How to switch the screen off at night:
;   auto      - pick the best available (recommended)
;   wlopm     - Wayland (labwc/wayfire) DPMS power-off       <- default on Pi OS Bookworm/Trixie
;   wlr-randr - Wayland: disable the output entirely
;   xset      - X11 DPMS
;   vcgencmd  - legacy firmware display driver only (no effect under KMS)
;   cec       - HDMI-CEC standby; really turns a TV off (needs v4l-utils)
;   none      - never touch the display
method = auto

; Output to switch: auto = all outputs, or a name such as HDMI-A-1 (see `wlr-randr`).
output = auto

; Only used by method = cec. HDMI0 is /dev/cec0, HDMI1 is /dev/cec1.
cec_device = /dev/cec0

[mqtt]
; MQTT control + Home Assistant auto-discovery.
enabled = no
; Your broker, e.g. the Home Assistant Mosquitto add-on.
host = homeassistant.local
port = 1883
username =
password =

; Topics are <topic_prefix>/<node_id>/..., e.g. picframe/livingroom/display/set
topic_prefix = picframe
; Must match Home Assistant's MQTT discovery prefix (default: homeassistant).
discovery_prefix = homeassistant
; Device name shown in Home Assistant.
device_name = Picture Frame
; Unique id for this frame. Empty = the Pi's hostname. Set it if you have several frames.
node_id =
